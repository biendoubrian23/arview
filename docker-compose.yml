services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
      args:
        CUDA_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
        CUDA_ARCHITECTURES: "89"
        PYTORCH_INDEX_URL: "https://download.pytorch.org/whl/cu124"
        BUILD_OPENMVS: "0"
    image: arview-backend-gpu:local
    ports:
      - "8050:8000"
    environment:
      ARVIEW_WORK_DIR: /workspace/jobs
      ARVIEW_MIN_FRAMES: "24"
      ARVIEW_MAX_FRAMES: "160"
      ARVIEW_IMAGE_MAX_SIZE: "1800"
      ARVIEW_SPLAT_METHOD: splatfacto-big
      ARVIEW_ENABLE_SPLAT: "1"
      ARVIEW_ENABLE_MESH: "1"
      ARVIEW_ENABLE_OPENMVS: "0"
    gpus: all
    volumes:
      - arview-jobs:/workspace/jobs
    restart: unless-stopped

  web:
    image: node:22-bookworm
    working_dir: /app
    ports:
      - "3050:3000"
    environment:
      NEXT_PUBLIC_SCAN_MODE: local
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3050}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PYTHON_BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./next.config.ts:/app/next.config.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
      - ./eslint.config.mjs:/app/eslint.config.mjs
      - ./.npmrc:/app/.npmrc
      - arview-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  arview-jobs:
  arview-node-modules:
